    // ==================== API串接：今日天氣（GAS代理） ====================
    const GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbwNvJlF8fHZSZbm8k7rcEXL7Yw1BssQ35LCxPrMfAr_dkPcTwJQ3Cqooyb3KoT0HmoB4g/exec';
    const FALLBACK_COUNTY = '台中市';
    const FALLBACK_TOWNSHIP = '東區';
    const MAX_FAVORITES = 5;

    // 目前地點：優先讀localStorage（使用者上次手動選過的地點），沒有才用預設值
    let currentCounty = localStorage.getItem('muji_county') || FALLBACK_COUNTY;
    let currentTownship = localStorage.getItem('muji_township') || FALLBACK_TOWNSHIP;
    let townshipsData = null; // 由GAS ?action=townships 動態取得，避免跟後端清單重複維護兩份

    const WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];
    const LUNAR_MONTH_NAME = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
    const LUNAR_DAY_NAME = ['', '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
      '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
      '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

    function pad2(n) { return String(n).padStart(2, '0'); }
    function todayDateStr() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function lunarLabel(dateStr) {
      const l = LUNAR_2026[dateStr];
      if (!l) return '';
      const isLeap = String(l.month).includes('閏');
      const monthNum = parseInt(String(l.month).replace('閏', ''), 10);
      const monthName = (isLeap ? '閏' : '') + (LUNAR_MONTH_NAME[monthNum] || monthNum) + '月';
      const dayName = LUNAR_DAY_NAME[parseInt(l.day, 10)] || l.day;
      return `農曆${monthName}${dayName}`;
    }

    function solarTermLabel(dateStr) {
      // 找「最近一個已經發生（<=今天）」的節氣
      const dates = Object.keys(SOLAR_TERMS_2026).sort();
      let picked = null;
      for (const d of dates) {
        if (d <= dateStr) picked = d; else break;
      }
      return picked ? SOLAR_TERMS_2026[picked].term : '';
    }

    // 風向角度(0~360) 轉 8方位中文
    function degToCompass(deg) {
      const dirs = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
      const idx = Math.round((parseFloat(deg) % 360) / 45) % 8;
      return dirs[idx];
    }

    function uvStatus(uv) {
      const v = parseFloat(uv);
      if (isNaN(v)) return '--';
      if (v <= 2) return '低量';
      if (v <= 5) return '中量';
      if (v <= 7) return '高量';
      if (v <= 10) return '過量';
      return '危險';
    }

    function aqiStatusColor(status) {
      if (status === '良好') return 'text-emerald-500';
      if (status === '普通') return 'text-yellow-500';
      return 'text-orange-500';
    }

    async function fetchGas(action, params) {
      const usp = new URLSearchParams({ action, ...params });
      try {
        const res = await fetch(`${GAS_BASE_URL}?${usp.toString()}`);
        if (!res.ok) return { ok: false, error: `伺服器回應異常（狀態碼${res.status}）`, networkError: true };
        return await res.json();
      } catch (err) {
        return { ok: false, error: '網路連線異常，請確認網路後重試', networkError: true };
      }
    }

    /** 把CWA/NCDR等外部來源文字轉義後才塞進innerHTML，防禦性寫法（來源雖可信但不假設內容一定乾淨） */
    function escapeHtml_(str) {
      if (str === null || str === undefined) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(str).replace(/[&<>"']/g, c => map[c]);
    }

// 天氣現象文字 → icon+顏色 對照（沿用逐時預報/週預報既有色票，全站配色一致）
function wxIconInfo(text, isNight) {
  if (!text) return { icon: 'fa-cloud', color: 'text-gray-400' };
  if (/雷/.test(text)) return { icon: 'fa-cloud-bolt', color: 'text-violet-400' };
  if (/豪雨|大雨|暴雨/.test(text)) return { icon: 'fa-cloud-showers-heavy', color: 'text-blue-500' };
  if (/陣雨|雨/.test(text)) return { icon: 'fa-cloud-rain', color: 'text-blue-400' };
  if (/雪/.test(text)) return { icon: 'fa-snowflake', color: 'text-slate-300' };
  if (/霧|靄|霾/.test(text)) return { icon: 'fa-smog', color: 'text-gray-400' };
  if (/多雲/.test(text)) return isNight ? { icon: 'fa-cloud-moon', color: 'text-indigo-300' } : { icon: 'fa-cloud-sun', color: 'text-amber-500' };
  if (/陰/.test(text)) return { icon: 'fa-cloud', color: 'text-gray-400' };
  if (/晴/.test(text)) return isNight ? { icon: 'fa-moon', color: 'text-indigo-300' } : { icon: 'fa-sun', color: 'text-amber-500' };
  return { icon: 'fa-cloud', color: 'text-gray-400' };
}

    async function loadTodayWeather() {
      const dateStr = todayDateStr();
      const d = new Date();
      const weekdayZh = WEEKDAY_ZH[d.getDay()];

      // 日期/農曆節氣 badge（拆兩個），先用本地靜態資料顯示，不用等API
      document.getElementById('badge-date').textContent =
        `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${weekdayZh}）`;
      document.getElementById('badge-lunar').textContent =
        `${lunarLabel(dateStr)}｜節氣 ${solarTermLabel(dateStr)}`;

      // 四支API平行呼叫，各自獨立處理失敗，不互相卡住
      // O-A0003已包含溫度/濕度/風向/天氣現象/紫外線，today跟uv合併成一次呼叫
      const [todayRes, forecastRes, aqiRes, sunRes] = await Promise.allSettled([
        fetchGas('today', { county: currentCounty, township: currentTownship }),
        fetchGas('forecast', { county: currentCounty, township: currentTownship }),
        fetchGas('aqi', { county: currentCounty, township: currentTownship }),
        fetchGas('sun', { county: currentCounty })
      ]);

      // ---- A-B0062 日出日沒（依縣市，非鄉鎮層級） ----
      if (sunRes.status === 'fulfilled' && sunRes.value.ok) {
        document.getElementById('val-sunrise').textContent = sunRes.value.sunrise || '--:--';
        document.getElementById('val-sunset').textContent = sunRes.value.sunset || '--:--';
      } else {
        document.getElementById('val-sunrise').textContent = '--:--';
        document.getElementById('val-sunset').textContent = '--:--';
      }

      // ---- O-A0003 10分鐘綜觀觀測（溫度/濕度/風向/天氣現象/紫外線） ----
      if (todayRes.status === 'fulfilled' && todayRes.value.ok) {
        const t = todayRes.value;
        document.getElementById('header-obstime').textContent = (t.obsTime || '').slice(11, 16);
        document.getElementById('val-temp').textContent = `${Math.round(parseFloat(t.temperature))}°`;
        const wxNow = t.weather;
        document.getElementById('val-wx-now').textContent = `現在：${wxNow}`;
        const nowHour = new Date().getHours();
        const { icon, color } = wxIconInfo(wxNow, nowHour >= 18 || nowHour < 6);
        document.getElementById('wx-icon').className = `fa-solid ${icon} text-5xl ${color} mb-3`;
        document.getElementById('val-rh').textContent = `${t.humidity}%`;
        if (t.windDirection !== undefined) {
          const compass = degToCompass(t.windDirection);
          document.getElementById('val-wind').firstChild.textContent = `${compass}風 `;
          document.getElementById('val-wind-arrow').style.transform = `rotate(${t.windDirection}deg)`;
        }
        if (!t.noDataAtNight && t.uvIndex !== null && t.uvIndex !== undefined) {
          document.getElementById('val-uv').firstChild.textContent = `${t.uvIndex} `;
          document.getElementById('val-uv-status').textContent = uvStatus(t.uvIndex);
        } else {
          document.getElementById('val-uv').firstChild.textContent = '-- ';
          document.getElementById('val-uv-status').textContent = '夜間無資料';
        }
      } else {
        document.getElementById('val-wx-now').textContent = '現在：資料載入失敗';
      }

      // ---- F-D0047 預報（體感/舒適度/降雨機率/天氣現象） ----
      if (forecastRes.status === 'fulfilled' && forecastRes.value.ok) {
        const els = forecastRes.value.elements;
        const at = els['體感溫度'] && els['體感溫度'].value.ApparentTemperature;
        const comfort = els['舒適度指數'] && els['舒適度指數'].value.ComfortIndexDescription;
        const pop = els['3小時降雨機率'] && els['3小時降雨機率'].value.ProbabilityOfPrecipitation;
        const wxForecast = els['天氣現象'] && els['天氣現象'].value.Weather;

        if (at !== undefined) document.getElementById('val-at').textContent = `體感 ${at}°C`;
        if (comfort) document.getElementById('val-comfort').textContent = comfort;
        if (pop !== undefined) document.getElementById('val-pop').textContent = `${pop}%`;
        if (wxForecast) document.getElementById('val-wx-forecast').textContent = `預報：${wxForecast}`;
      } else {
        document.getElementById('val-wx-forecast').textContent = '預報：資料載入失敗';
      }

      // ---- 空氣品質 ----
      if (aqiRes.status === 'fulfilled' && aqiRes.value.ok) {
        const a = aqiRes.value;
        document.getElementById('val-aqi').firstChild.textContent = `${a.aqi} `;
        const statusEl = document.getElementById('val-aqi-status');
        statusEl.textContent = a.status;
        statusEl.className = `text-xs font-normal ${aqiStatusColor(a.status)}`;
      } else {
        document.getElementById('val-aqi').firstChild.textContent = '-- ';
      }
    }

    loadTodayWeather();

    // ==================== 逐時預報：動態渲染（真實API資料） ====================
    // 設計：全部統一「每小時一欄」顯示。CWA資料本身第1天是逐1小時，第2天起只有
    // 逐3小時——欄位不足1小時解析度的時段，同一個3小時區間內的每一欄都顯示
    // 「那個3小時區間本身的真實數值」（例如溫度、降雨機率、風向），不是憑空
    // 內插出來的假數字，只是誠實地重複顯示同一筆真實資料。
    // 天數不寫死：F-D0047是「未來72小時」的滾動窗口，依查詢當下時間，
    // 實際涵蓋的日曆天數可能是3~4天，全部依API實際回傳筆數呈現。

    function compassToDeg(text) {
      if (!text) return 0;
      const dirs = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
      const clean = text.replace('風', '').replace('偏', '');
      const idx = dirs.indexOf(clean);
      return idx === -1 ? 0 : idx * 45;
    }

    // 逐時預報(grid排版，wrapCls留空由grid控制寬度)與週預報(flex排版，wrapCls傳'w-20')共用的render函式
    function windSpan_(dirText, wrapCls) {
      const deg = compassToDeg(dirText);
      const data = dirText
        ? `<span class="inline-block w-5 flex justify-center"><i class="fa-solid fa-arrow-down inline-block" style="transform:rotate(${deg}deg)"></i></span>`
        : '<span class="inline-block w-5 text-center">—</span>';
      return `<div class="${wrapCls || ''} flex items-center justify-center gap-0.5 py-1" title="${escapeHtml_(dirText) || '無資料'}"><i class="fa-solid fa-wind w-3 text-center text-[10px]"></i>${data}</div>`;
    }
    function rainSpan_(pct, wrapCls) {
      return `<div class="${wrapCls || ''} flex items-center justify-center gap-0.5 py-1"><i class="fa-solid fa-umbrella w-3 text-center text-[10px]"></i><span class="inline-block w-6 text-right tabular-nums">${pct ?? '--'}%</span></div>`;
    }
    function rhSpan_(pct, wrapCls) {
      return `<div class="${wrapCls || ''} flex items-center justify-center gap-0.5 py-1"><i class="fa-solid fa-droplet w-3 text-center text-[10px]"></i><span class="inline-block w-6 text-right tabular-nums">${pct ?? '--'}%</span></div>`;
    }
    function wxSpan_(text, isNight, wrapCls) {
      const { icon, color } = wxIconInfo(text, isNight);
      return `<div class="${wrapCls || ''} text-center ${color} py-1"><i class="fa-solid ${icon}"></i></div>`;
    }
    function comfortSpan_(text, wrapCls) {
      return `<div class="${wrapCls || ''} text-center text-muji-textMutedLight dark:text-muji-textMutedDark py-1">${text || '--'}</div>`;
    }

    function buildDayPanel(dateKey, dateLabel, hidden, cols) {
      const n = cols.length;
      const gridCols = `grid-template-columns:repeat(${n},minmax(64px,1fr))`;
      const morningNight = cols.filter(c => c.hour < 6).length;
      const daySpan = cols.filter(c => c.hour >= 6 && c.hour < 18).length;
      const eveningNight = n - morningNight - daySpan;

      const dateRow = cols.map(() => `<div class="text-center">${dateLabel}</div>`).join('');
      const timeRow = cols.map(c => `<div class="text-center">${c.hhmm}</div>`).join('');
const wxRow = cols.map(c => wxSpan_(c.weather, c.hour >= 18 || c.hour < 6, '')).join('');
      const rainRow = cols.map(c => rainSpan_(c.pop, '')).join('');
      const rhRow = cols.map(c => rhSpan_(c.rh, '')).join('');
      const windRow = cols.map(c => windSpan_(c.wind, '')).join('');
      const comfortRow = cols.map(c => comfortSpan_(c.comfort, '')).join('');

      const temps = cols.map(c => c.temp).filter(t => !isNaN(t));
      const tmin = Math.min(...temps), tmax = Math.max(...temps);
      const span = Math.max(tmax - tmin, 1);
      const colw = 100, totalW = n * colw;
      const xs = cols.map((c, i) => colw * (i + 0.5));
      const ys = cols.map(c => 8 + (tmax - c.temp) / span * 54);
      const tempLabels = cols.map(c => `<div class="text-center">${isNaN(c.temp) ? '--' : c.temp}°</div>`).join('');

      const segIdx = (from, to) => cols.map((c, i) => i).slice(from, to);
      const segs = [];
      if (morningNight > 0) segs.push([segIdx(0, morningNight + (daySpan > 0 ? 1 : 0)), 'text-indigo-400 dark:text-indigo-300']);
      if (daySpan > 0) segs.push([segIdx(morningNight, morningNight + daySpan + (eveningNight > 0 ? 1 : 0)), 'text-amber-500']);
      if (eveningNight > 0) segs.push([segIdx(morningNight + daySpan, n), 'text-indigo-400 dark:text-indigo-300']);

      const paths = segs.map(([idxs, color]) =>
        `<path d="M ${idxs.map(i => `${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`).join(' L ')}" fill="none" stroke="currentColor" stroke-width="2.5" class="${color}" />`
      ).join('');
      const dots = cols.map((c, i) => {
        const seg = segs.find(([idxs]) => idxs.includes(i));
        const color = seg ? seg[1] : 'text-amber-500';
        return `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" class="${color}" fill="currentColor" />`;
      }).join('');
      const svg = `<svg class="w-full h-24 absolute bottom-0 inset-x-0 z-10" viewBox="0 0 ${totalW} 70" preserveAspectRatio="none">${paths}${dots}</svg>`;

      return `
          <div id="hour-day-${dateKey}" class="hour-day-panel overflow-x-auto no-scrollbar pb-2${hidden ? ' hidden' : ''}">
            <div class="relative" style="min-width:${n * 64}px">
              <div class="absolute inset-0 grid pointer-events-none rounded-2xl overflow-hidden top-[52px] bottom-0" style="${gridCols}">
                ${morningNight > 0 ? `<div style="grid-column:span ${morningNight}" class="bg-gradient-to-b from-indigo-900/15 to-indigo-900/5 dark:from-indigo-950/40 dark:to-indigo-950/15"></div>` : ''}
                ${daySpan > 0 ? `<div style="grid-column:span ${daySpan}" class="bg-amber-500/5"></div>` : ''}
                ${eveningNight > 0 ? `<div style="grid-column:span ${eveningNight}" class="bg-gradient-to-b from-indigo-900/5 to-indigo-900/15 dark:from-indigo-950/15 dark:to-indigo-950/40"></div>` : ''}
              </div>
              <div class="relative flex flex-col space-y-3 pt-2 text-xs z-10">
                <div class="grid font-bold border-b border-muji-borderLight dark:border-muji-borderDark pb-2 text-muji-textMutedLight dark:text-muji-textMutedDark" style="${gridCols}">${dateRow}</div>
                <div class="grid font-medium" style="${gridCols}">${timeRow}</div>
                <div class="grid text-base my-1" style="${gridCols}">${wxRow}</div>
                <div class="h-28 relative">
                  <div class="grid w-full absolute top-1 z-20 font-mono font-bold" style="${gridCols}">${tempLabels}</div>
                  ${svg}
                </div>
                <div class="grid text-blue-500 font-medium" style="${gridCols}">${rainRow}</div>
                <div class="grid text-teal-600 dark:text-teal-400" style="${gridCols}">${rhRow}</div>
                <div class="grid text-muji-textMutedLight dark:text-muji-textMutedDark" style="${gridCols}">${windRow}</div>
                <div class="grid text-[11px] text-muji-textMutedLight dark:text-muji-textMutedDark pt-1 pb-2 border-t border-muji-textMutedLight/25 dark:border-muji-textMutedDark/25" style="${gridCols}">${comfortRow}</div>
              </div>
            </div>
          </div>`;
    }

    async function loadHourlyForecast() {
      const tabsEl = document.getElementById('hour-day-tabs');
      const panelsEl = document.getElementById('hour-day-panels');
      tabsEl.innerHTML = `<div class="h-6 w-16 rounded-full bg-muji-borderLight dark:bg-muji-borderDark animate-pulse"></div><div class="h-6 w-16 rounded-full bg-muji-borderLight dark:bg-muji-borderDark animate-pulse"></div>`;
      panelsEl.innerHTML = `<div class="animate-pulse space-y-3"><div class="h-4 w-2/3 bg-muji-borderLight dark:bg-muji-borderDark rounded"></div><div class="h-24 bg-muji-borderLight dark:bg-muji-borderDark rounded-2xl"></div><div class="h-4 w-full bg-muji-borderLight dark:bg-muji-borderDark rounded"></div></div>`;
      const res = await fetchGas('hourly', { county: currentCounty, township: currentTownship });

      if (!res.ok) {
        tabsEl.innerHTML = '<span class="text-xs text-red-500">逐時預報載入失敗</span>';
        panelsEl.innerHTML = '';
        return;
      }

      const els = res.elements;
      // 「天氣現象」全程3小時一格、涵蓋整個資料範圍，拿它的區塊(start~end)當作展開每小時欄位的基準
      const blocks = els['天氣現象'] || [];
      if (blocks.length === 0) {
        tabsEl.innerHTML = '<span class="text-xs text-red-500">無逐時資料</span>';
        return;
      }

      // 溫度另外建一份「精確時間→數值」對照表：第1天有逐1小時的真實條目會直接命中，
      // 命中不到的（第2天起）就會退回用區塊本身的3小時數值（見下方 lookupBlockValue）
      function buildTimeMap(elName, key) {
        const map = new Map();
        (els[elName] || []).forEach(e => { map.set(e.startTime, e.value[key]); });
        return map;
      }
      const tempMap = buildTimeMap('溫度', 'Temperature');
      const popMap = buildTimeMap('3小時降雨機率', 'ProbabilityOfPrecipitation');
      const rhMap = buildTimeMap('相對濕度', 'RelativeHumidity');
      const windMap = buildTimeMap('風向', 'WindDirection');
      const wxMap = buildTimeMap('天氣現象', 'Weather');
      const comfortMap = buildTimeMap('舒適度指數', 'ComfortIndexDescription');

      function lookupBlockValue(map, exactISO, blockStartISO) {
        if (map.has(exactISO)) return map.get(exactISO);
        if (map.has(blockStartISO)) return map.get(blockStartISO);
        return undefined;
      }

      // 把每個3小時區塊展開成3個「每小時一欄」，欄位密度全程一致
      const allCols = [];
      blocks.forEach(block => {
        const blockStart = new Date(block.startTime);
        for (let h = 0; h < 3; h++) {
          const hourDt = new Date(blockStart.getTime() + h * 3600 * 1000);
          // 直接用本地時間元件組字串（假設瀏覽器時區=台北），對齊CWA原始+08:00格式的key，
          // 不能用toISOString()，那會轉成UTC反而對不上
          const hourISO = `${hourDt.getFullYear()}-${String(hourDt.getMonth() + 1).padStart(2, '0')}-${String(hourDt.getDate()).padStart(2, '0')}T${String(hourDt.getHours()).padStart(2, '0')}:00:00+08:00`;
          allCols.push({
            dateKey: `${String(hourDt.getMonth() + 1).padStart(2, '0')}${String(hourDt.getDate()).padStart(2, '0')}`,
            dateLabel: `${String(hourDt.getMonth() + 1).padStart(2, '0')}/${String(hourDt.getDate()).padStart(2, '0')} (${WEEKDAY_ZH[hourDt.getDay()]})`,
            hour: hourDt.getHours(),
            hhmm: `${String(hourDt.getHours()).padStart(2, '0')}:00`,
            weather: lookupBlockValue(wxMap, hourISO, block.startTime),
            pop: lookupBlockValue(popMap, hourISO, block.startTime),
            rh: lookupBlockValue(rhMap, hourISO, block.startTime),
            wind: lookupBlockValue(windMap, hourISO, block.startTime),
            comfort: lookupBlockValue(comfortMap, hourISO, block.startTime),
            temp: parseFloat(lookupBlockValue(tempMap, hourISO, block.startTime))
          });
        }
      });

      // 依日期分組，天數不設限（依API實際涵蓋範圍，通常3~4天）
      const dayMap = new Map();
      allCols.forEach(c => {
        if (!dayMap.has(c.dateKey)) dayMap.set(c.dateKey, []);
        dayMap.get(c.dateKey).push(c);
      });
      const dayKeys = [...dayMap.keys()];

      tabsEl.innerHTML = dayKeys.map((k, i) => {
        const label = dayMap.get(k)[0].dateLabel; // MM/DD (週) 全部顯示
        const activeCls = i === 0
          ? 'hour-day-tab px-3 py-1 rounded-full text-xs font-medium bg-muji-textPrimaryLight dark:bg-muji-textPrimaryDark text-muji-bgLight dark:text-muji-bgDark'
          : 'hour-day-tab px-3 py-1 rounded-full text-xs font-medium text-muji-textMutedLight dark:text-muji-textMutedDark hover:bg-muji-bgLight dark:hover:bg-muji-bgDark';
        return `<button onclick="switchHourDay('${k}')" id="hourtab-${k}" class="${activeCls}">${label}</button>`;
      }).join('');

      panelsEl.innerHTML = dayKeys.map((k, i) => {
        const cols = dayMap.get(k);
        return buildDayPanel(k, cols[0].dateLabel, i !== 0, cols);
      }).join('');
    }

    loadHourlyForecast();

    // ==================== 一週預報：動態渲染（真實API資料） ====================
    // F-D0047週報資料集為逐12小時區塊（06-18白天／18-06晚上），每個區塊本身
    // 已內含當時段的最高/最低溫、降雨機率等，不需要像逐時那樣額外拆分或內插。

    function weekTempBar(cols, isDay) {
      const vals = cols.flatMap(c => [c.tmax, c.tmin]).filter(v => !isNaN(v));
      const scaleMax = Math.max(...vals), scaleMin = Math.min(...vals);
      const span = Math.max(scaleMax - scaleMin, 1);
      const y = v => 15 + (scaleMax - v) / span * 90;
      const topColor = isDay ? 'text-amber-600' : 'text-indigo-500';
      return `<div class="flex justify-between relative" style="height:140px">${cols.map(c => {
        const yMax = y(c.tmax), yMin = y(c.tmin);
        return `<div class="w-20 relative" style="height:120px">
          <span class="absolute left-0 right-0 text-center font-mono font-bold ${topColor}" style="top:${(yMax - 8).toFixed(0)}px">${isNaN(c.tmax) ? '--' : c.tmax}°</span>
          <div class="absolute left-1/2 -translate-x-1/2 w-1.5 ${isDay ? 'bg-amber-400/70' : 'bg-indigo-400/70'} rounded-full" style="top:${(yMax + 8).toFixed(0)}px;height:${Math.max(yMin - yMax - 16, 8).toFixed(0)}px"></div>
          <span class="absolute left-0 right-0 text-center font-mono font-bold text-blue-500" style="top:${(yMin - 8).toFixed(0)}px">${isNaN(c.tmin) ? '--' : c.tmin}°</span>
        </div>`;
      }).join('')}</div>`;
    }
    function weekRowBlock(cols, isDay) {
      const wxRow = cols.map(c => wxSpan_(c.wx, !isDay, 'w-20')).join('');
      const rainRow = cols.map(c => rainSpan_(c.pop, 'w-20')).join('');
      const rhRow = cols.map(c => rhSpan_(c.rh, 'w-20')).join('');
      const windRow = cols.map(c => windSpan_(c.wind, 'w-20')).join('');
      const comfortRow = cols.map(c => comfortSpan_(c.comfort, 'w-20')).join('');
      const bgCls = isDay ? 'bg-amber-500/5' : 'bg-gradient-to-b from-indigo-900/10 to-indigo-900/[0.03] dark:from-indigo-950/40 dark:to-indigo-950/10';
      const labelCls = isDay ? 'text-amber-600 dark:text-amber-400' : 'text-indigo-600 dark:text-indigo-400';
      const label = isDay ? '<i class="fa-solid fa-sun"></i> 白天' : '<i class="fa-solid fa-moon"></i> 晚上';
      return `
              <div class="rounded-2xl ${isDay ? '' : 'mt-3'} ${bgCls} p-3 space-y-2">
                <p class="text-[11px] font-bold ${labelCls} flex items-center gap-1.5">${label}</p>
                <div class="flex justify-between text-base">${wxRow}</div>
                ${weekTempBar(cols, isDay)}
                <div class="flex justify-between text-blue-500 font-medium">${rainRow}</div>
                <div class="flex justify-between text-teal-600 dark:text-teal-400">${rhRow}</div>
                <div class="flex justify-between text-muji-textMutedLight dark:text-muji-textMutedDark">${windRow}</div>
                <div class="flex justify-between text-[11px] text-muji-textMutedLight dark:text-muji-textMutedDark pt-1 border-t border-muji-textMutedLight/25 dark:border-muji-textMutedDark/25">${comfortRow}</div>
              </div>`;
    }

    async function loadWeeklyForecast() {
      const tableEl = document.getElementById('weekly-table');
      tableEl.innerHTML = `<div class="animate-pulse space-y-3"><div class="h-4 w-full bg-muji-borderLight dark:bg-muji-borderDark rounded"></div><div class="h-32 w-full bg-muji-borderLight dark:bg-muji-borderDark rounded-2xl"></div><div class="h-32 w-full bg-muji-borderLight dark:bg-muji-borderDark rounded-2xl"></div></div>`;
      const res = await fetchGas('weekly', { county: currentCounty, township: currentTownship });
      if (!res.ok) {
        tableEl.innerHTML = '<span class="text-xs text-red-500">一週預報載入失敗</span>';
        return;
      }
      const els = res.elements;
      const blocks = els['天氣現象'] || [];
      if (blocks.length === 0) {
        tableEl.innerHTML = '<span class="text-xs text-red-500">無週報資料</span>';
        return;
      }
      function byStart(elName, key) {
        const map = new Map();
        (els[elName] || []).forEach(e => { map.set(e.startTime, e.value[key]); });
        return map;
      }
      const maxTMap = byStart('最高溫度', 'MaxTemperature');
      const minTMap = byStart('最低溫度', 'MinTemperature');
      const popMap = byStart('12小時降雨機率', 'ProbabilityOfPrecipitation');
      const rhMap = byStart('平均相對濕度', 'RelativeHumidity');
      const windMap = byStart('風向', 'WindDirection');
      const maxComfortMap = byStart('最大舒適度指數', 'MaxComfortIndexDescription');
      const minComfortMap = byStart('最小舒適度指數', 'MinComfortIndexDescription');

      // 依日期分組，每天理應為[白天區塊, 晚上區塊]，天數依API實際回傳(通常7天)
      const dayMap = new Map();
      blocks.forEach(b => {
        const dt = new Date(b.startTime);
        const isDay = dt.getHours() >= 6 && dt.getHours() < 18;
        const dateKey = `${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
        if (!dayMap.has(dateKey)) dayMap.set(dateKey, { label: `${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')} (${WEEKDAY_ZH[dt.getDay()]})`, day: null, night: null });
        const col = {
          wx: b.value.Weather,
          tmax: parseFloat(maxTMap.get(b.startTime)),
          tmin: parseFloat(minTMap.get(b.startTime)),
          pop: popMap.get(b.startTime),
          rh: rhMap.get(b.startTime),
          wind: windMap.get(b.startTime),
          comfort: isDay ? maxComfortMap.get(b.startTime) : minComfortMap.get(b.startTime)
        };
        if (isDay) dayMap.get(dateKey).day = col; else dayMap.get(dateKey).night = col;
      });

      const dayKeys = [...dayMap.keys()];
      const dateRow = dayKeys.map(k => `<span class="w-20 text-center">${dayMap.get(k).label}</span>`).join('');
      const dayCols = dayKeys.map(k => dayMap.get(k).day || { wx: '', tmax: NaN, tmin: NaN, pop: null, rh: null, wind: '', comfort: '' });

let radarFrames = null;
let radarPlaying = false;
let radarTimer = null;

function radarFrameDateTime_(name, idx) {
  const m = name.match(/nowcast_(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
  if (!m) return '--';
  const baseUTC = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const t = new Date(baseUTC + idx * 10 * 60 * 1000);
  const mm = String(t.getMonth() + 1).padStart(2, '0');
  const dd = String(t.getDate()).padStart(2, '0');
  const hh = String(t.getHours()).padStart(2, '0');
  const mi = String(t.getMinutes()).padStart(2, '0');
  return `${mm}-${dd} ${hh}:${mi}`;
}

let radarLoading = false;
async function loadRadarNowcast() {
  if (radarLoading) return;
  radarLoading = true;
  const loadingText = document.getElementById('radar-loading-text');
  loadingText.classList.remove('hidden');
  loadingText.textContent = '載入雷達回波中...';
  try {
    const res = await fetchGas('radar', {});
    const img = document.getElementById('radar-frame-img');
    if (!res.ok || !res.images || res.images.length === 0) {
      if (res.throttled && radarFrames) {
        loadingText.classList.add('hidden'); // 短時間內重複點擊，畫面已有資料可看，靜默略過不顯示錯誤
        return;
      }
      loadingText.innerHTML = `${escapeHtml_(res.error) || '雷達回波載入失敗'}<button onclick="loadRadarNowcast()" class="ml-2 underline">重試</button>`;
      return;
    }
    radarFrames = res.images;
    img.classList.remove('hidden');
    loadingText.classList.add('hidden');
    document.getElementById('radar-slider').max = radarFrames.length - 1;
    setRadarFrame(0);
    if (!currentLocationLatLng) {
      const res2 = await fetchGas('townshipLatLng', { county: currentCounty, township: currentTownship });
      if (res2.ok) currentLocationLatLng = { lat: res2.lat, lng: res2.lng };
    }
    updateRadarMarker();
    toggleRadarPlay();
  } finally {
    radarLoading = false;
  }
}

function setRadarFrame(i) {
  if (!radarFrames || !radarFrames[i]) return;
  document.getElementById('radar-frame-img').src = `data:image/png;base64,${radarFrames[i].base64}`;
  document.getElementById('radar-slider').value = i;

// 這組係數是用東引、鵝鑾鼻、綠島、淡水漁人碼頭、烈嶼五個已知地標回推校準（等距投影，無變形，五點誤差都在6px內）
function radarLonToX_(lon) { return 370.6246 * lon - 43424.4393; }
function radarLatToY_(lat) { return -371.4881 * lat + 9850.3181; }
const RADAR_IMG_W_ = 2512, RADAR_IMG_H_ = 1927;

let currentLocationLatLng = null; // {lat, lng}，換地點時更新

function updateRadarMarker() {
  const marker = document.getElementById('radar-location-marker');
  if (!currentLocationLatLng) { marker.classList.add('hidden'); return; }
  const xPct = (radarLonToX_(currentLocationLatLng.lng) / RADAR_IMG_W_) * 100;
  const yPct = (radarLatToY_(currentLocationLatLng.lat) / RADAR_IMG_H_) * 100;
  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) { marker.classList.add('hidden'); return; }
  marker.style.left = `${xPct}%`;
  marker.style.top = `${yPct}%`;
  marker.classList.remove('hidden');
  marker.classList.add('flex');
}

function toggleRadarPlay() {
  const btn = document.getElementById('radar-play-btn').querySelector('i');
  if (radarPlaying) {
    clearInterval(radarTimer);
    radarPlaying = false;
    btn.className = 'fa-solid fa-play text-xs';
    return;
  }
  if (!radarFrames) return;
  radarPlaying = true;
  btn.className = 'fa-solid fa-pause text-xs';
  let i = parseInt(document.getElementById('radar-slider').value, 10);
  radarTimer = setInterval(() => {
    i = (i + 1) % radarFrames.length;
    setRadarFrame(i);
  }, 800);
}

let latestEarthquakeData = null;
const INTENSITY_ORDER_ = ['0級','1級','2級','3級','4級','5弱','5強','6弱','6強','7級'];
const INTENSITY_COLOR_MAP_ = {
  '0級': 'bg-gray-400/15 text-gray-500',
  '1級': 'bg-sky-400/15 text-sky-500',
  '2級': 'bg-teal-400/15 text-teal-500',
  '3級': 'bg-lime-500/15 text-lime-600',
  '4級': 'bg-yellow-500/15 text-yellow-600',
  '5弱': 'bg-amber-500/15 text-amber-600',
  '5強': 'bg-orange-500/15 text-orange-600',
  '6弱': 'bg-red-500/15 text-red-600',
  '6強': 'bg-red-600/15 text-red-700',
  '7級': 'bg-purple-700/15 text-purple-700'
};
const MAGNITUDE_BADGE_CLS_ = 'bg-rose-500/15 text-rose-600 dark:text-rose-400';

function intensityBadgeCls_(intensity) { return INTENSITY_COLOR_MAP_[intensity] || 'bg-gray-400/15 text-gray-500'; }
function maxIntensity_(areas) {
  let best = -1, label = '--';
  areas.forEach(a => { const idx = INTENSITY_ORDER_.indexOf(a.intensity); if (idx > best) { best = idx; label = a.intensity; } });
  return label;
}
function groupByIntensity_(areas) {
  const map = new Map();
  areas.forEach(a => {
    if (!map.has(a.intensity)) map.set(a.intensity, new Set());
    // county欄位可能是單一縣市，也可能是CWA合併回傳的多縣市字串（用、分隔），拆開後個別加入避免重複
    (a.county || '').split('、').filter(Boolean).forEach(c => map.get(a.intensity).add(c));
  });
  return [...map.keys()]
    .sort((a, b) => INTENSITY_ORDER_.indexOf(b) - INTENSITY_ORDER_.indexOf(a))
    .map(k => ({ intensity: k, counties: [...map.get(k)] }));
}
// "臺東縣政府東南東方 48.0 公里 (位於臺灣東南部海域)" → 只取括號內文字
function shortLocation_(epicenter) {
  const m = (epicenter || '').match(/\(位於(.+?)\)/);
  return m ? m[1] : (epicenter || '--');

// 去掉尾端括號說明，留原始方位距離敘述
function stripLocationParen_(epicenter) {
  return (epicenter || '').replace(/\s*\(位於.+?\)\s*$/, '');
}

        document.getElementById('location-status').textContent = '';
        if (!townshipsData) loadTownships();
      } else {
        modal.classList.add('opacity-0', 'pointer-events-none');
        container.classList.remove('scale-100');
        container.classList.add('scale-95');
      }
    }

    function updateHeaderLocation() {
      document.getElementById('header-location-text').textContent = `${currentCounty}${currentTownship}`;
    }

    async function loadTownships() {
      const res = await fetchGas('townships', {});
      if (!res.ok) {
        document.getElementById('location-status').innerHTML = `縣市鄉鎮清單載入失敗<button onclick="loadTownships()" class="ml-2 underline">重試</button>`;
        return;
      }
      townshipsData = res.townships;
      const countySel = document.getElementById('select-county');
      countySel.innerHTML = Object.keys(townshipsData).map(c => `<option value="${c}">${c}</option>`).join('');
      countySel.value = currentCounty;
      onCountyChange();
      document.getElementById('select-township').value = currentTownship;
    }

    function onCountyChange() {
      const county = document.getElementById('select-county').value;
      const townshipSel = document.getElementById('select-township');
      const list = (townshipsData && townshipsData[county]) || [];
      townshipSel.innerHTML = list.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    // 換地點：更新狀態、存localStorage、更新標頭、重抓今日/逐時/週報三支API
function switchLocation(county, township) {
  currentCounty = county;
  currentTownship = township;
  localStorage.setItem('muji_county', county);
  localStorage.setItem('muji_township', township);
  updateHeaderLocation();
  loadTodayWeather();
  loadHourlyForecast();
  loadWeeklyForecast();
  loadAlerts();
  fetchGas('townshipLatLng', { county, township }).then(res => {
    if (res.ok) { currentLocationLatLng = { lat: res.lat, lng: res.lng }; updateRadarMarker(); }
  });
}

    function applySelectedLocation() {
      const county = document.getElementById('select-county').value;
      const township = document.getElementById('select-township').value;
      if (!county || !township) return;
      switchLocation(county, township);
      toggleLocationModal(false);
    }

    function useCurrentLocation() {
      const statusEl = document.getElementById('location-status');
      if (!navigator.geolocation) {
        statusEl.textContent = '此瀏覽器不支援定位功能';
        return;
      }
      statusEl.textContent = '定位中...';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        statusEl.textContent = '反查行政區中...';
        const res = await fetchGas('geolocate', { lat: latitude, lng: longitude });
        if (!res.ok) {
          statusEl.textContent = `定位反查失敗：${res.error || '未知錯誤'}（可改用下方手動選擇）`;
          return;
        }
        if (!townshipsData) await loadTownships();
        document.getElementById('select-county').value = res.county;
        onCountyChange();
        document.getElementById('select-township').value = res.township;
        statusEl.textContent = `定位到：${res.county}${res.township}，請按下方「套用地點」確認`;
      }, (err) => {
        const GEO_ERR_MSG = { 1: '你拒絕了定位權限', 2: '目前無法取得定位（訊號或裝置問題）', 3: '定位逾時' };
        statusEl.textContent = `無法取得定位：${GEO_ERR_MSG[err.code] || '未知錯誤'}，請改用下方手動選擇`;
      });
    }

    // ---- 常用地點（localStorage，最多5個） ----
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem('muji_favorites') || '[]'); } catch (e) { return []; }
    }
    function saveFavorites(list) {
      localStorage.setItem('muji_favorites', JSON.stringify(list));
    }
    function renderFavorites() {
      const list = getFavorites();
      const el = document.getElementById('favorites-list');
      if (list.length === 0) {
        el.innerHTML = '<span class="text-xs text-muji-textMutedLight dark:text-muji-textMutedDark">尚無常用地點</span>';
        return;
      }
      el.innerHTML = list.map((f, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-muji-bgLight dark:bg-muji-bgDark border border-muji-borderLight dark:border-muji-borderDark text-xs">
          <button data-fav-goto="${i}" class="hover:text-muji-accentLight dark:hover:text-muji-accentDark">${escapeHtml_(f.county)}${escapeHtml_(f.township)}</button>
          <button data-fav-remove="${i}" class="text-muji-textMutedLight dark:text-muji-textMutedDark hover:text-red-500" title="移除"><i class="fa-solid fa-xmark text-[10px]"></i></button>
        </span>`).join('');
    }
    // 事件委派：常用地點清單只綁一次在父容器上，避免用字串拼接onclick塞入地名（萬一地名含特殊字元會斷字串）
    document.getElementById('favorites-list').addEventListener('click', (e) => {
      const gotoBtn = e.target.closest('[data-fav-goto]');
      if (gotoBtn) {
        const f = getFavorites()[parseInt(gotoBtn.dataset.favGoto, 10)];
        if (f) { switchLocation(f.county, f.township); toggleLocationModal(false); }
        return;
      }
      const removeBtn = e.target.closest('[data-fav-remove]');
      if (removeBtn) removeFavorite(parseInt(removeBtn.dataset.favRemove, 10));
    });
    function addCurrentAsFavorite() {
      const statusEl = document.getElementById('location-status');
      const list = getFavorites();
      if (list.some(f => f.county === currentCounty && f.township === currentTownship)) {
        statusEl.textContent = '目前地點已經在常用清單裡了';
        return;
      }
      if (list.length >= MAX_FAVORITES) {
        statusEl.textContent = `常用地點最多${MAX_FAVORITES}個，請先移除一個再新增`;
        return;
      }
      list.push({ county: currentCounty, township: currentTownship });
      saveFavorites(list);
      renderFavorites();
      statusEl.textContent = '已加入常用地點';
    }
    function removeFavorite(index) {
      const list = getFavorites();
      list.splice(index, 1);
      saveFavorites(list);
      renderFavorites();
    }

    updateHeaderLocation();
    renderFavorites();
  </script>
</body>
</html>
